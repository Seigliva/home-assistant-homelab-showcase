# Sanitized adaptation. Automations start disabled; see README.md.
input_text:
  toilet_before_night:
    name: Toilet normal light state
    max: 255
automation:
- id: example_toilet_night
  triggers:
  - entity_id:
    - binary_sensor.toilet_motion
    to: 'on'
    id: Detected
    trigger: state
  - entity_id:
    - binary_sensor.toilet_motion
    to: 'off'
    id: Clear
    for:
      hours: 0
      minutes: 10
      seconds: 0
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Detected
      - condition: state
        entity_id: light.toilet
        state: 'off'
      sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id: schedule.night_mode
            state: 'on'
          - condition: state
            entity_id: alarm_control_panel.home_alarm
            state: armed_home
          sequence:
          - if:
            - condition: template
              value_template: '{{ not ((states(''input_text.toilet_before_night'') | from_json({})).get(''brightness'',0)
                | int(0) > 0) }}'
            then:
            - action: input_text.set_value
              target:
                entity_id: input_text.toilet_before_night
              data:
                value: '{{ {''brightness'': state_attr(''light.toilet'',''brightness'') | int(186), ''color_temp_kelvin'':
                  state_attr(''light.toilet'',''color_temp_kelvin'') | int(2469)} | to_json }}'
          - action: light.turn_on
            target:
              entity_id: light.toilet
            data:
              brightness_pct: 10
              color_temp_kelvin: 2202
        default:
        - if:
          - condition: template
            value_template: '{{ (states(''input_text.toilet_before_night'') | from_json({})).get(''brightness'',0)
              | int(0) > 0 }}'
          then:
          - action: light.turn_on
            target:
              entity_id: light.toilet
            data:
              brightness: '{{ (states(''input_text.toilet_before_night'') | from_json({})).get(''brightness'',186)
                }}'
              color_temp_kelvin: '{{ (states(''input_text.toilet_before_night'') | from_json({})).get(''color_temp_kelvin'',2469)
                }}'
          - action: input_text.set_value
            target:
              entity_id: input_text.toilet_before_night
            data:
              value: ''
          else:
          - action: light.turn_on
            target:
              entity_id: light.toilet
            data: {}
    - conditions:
      - condition: trigger
        id:
        - Clear
      - condition: state
        entity_id: binary_sensor.toilet_motion
        state: 'off'
      sequence:
      - data: {}
        target:
          entity_id: light.toilet
        action: light.turn_off
  mode: restart
  alias: Example - Toilet night light
  initial_state: false
