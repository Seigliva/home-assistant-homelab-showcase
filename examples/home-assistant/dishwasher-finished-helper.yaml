# Sanitized adaptation. Automations start disabled; see README.md.
input_boolean:
  dishwasher_finished:
    name: Dishwasher finished
input_button:
  dishwasher_emptied:
    name: Mark dishwasher emptied
automation:
- id: example_dishwasher_finished
  alias: Example - Dishwasher finished
  triggers:
  - trigger: state
    entity_id: sensor.dishwasher_operation_state
    from: run
    to: finished
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.dishwasher_finished
  mode: single
  initial_state: false
- id: example_dishwasher_reset
  alias: Example - Dishwasher emptied
  triggers:
  - trigger: state
    entity_id: input_button.dishwasher_emptied
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.dishwasher_finished
  mode: single
  initial_state: false
