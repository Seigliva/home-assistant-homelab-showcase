# Sanitized adaptation. Automations start disabled; see README.md.
input_boolean:
  bedroom_motion_enabled:
    name: Bedroom motion enabled
  bedroom_manual_block:
    name: Bedroom manual block
  bedroom_manual_off_night:
    name: Bedroom manual off at night
input_datetime:
  bedroom_last_manual:
    name: Bedroom last manual command
    has_date: true
    has_time: true
script:
  bedroom_manual_light:
    alias: Example - Bedroom manual light command
    mode: queued
    fields:
      turn_on:
        description: True to turn on, false to turn off
        required: true
        selector:
          boolean: {}
      brightness:
        description: Brightness percentage for manual on
        default: 50
        selector:
          number:
            min: 1
            max: 100
    sequence:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.bedroom_manual_block
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.bedroom_last_manual
      data:
        timestamp: '{{ now().timestamp() }}'
    - if: '{{ not turn_on and is_state(''schedule.night_mode'', ''on'') }}'
      then:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.bedroom_manual_off_night
    - choose:
      - conditions: '{{ turn_on }}'
        sequence:
        - action: light.turn_on
          target:
            entity_id:
            - light.bedroom_main
            - light.bedroom_bedside
          data:
            brightness_pct: '{{ brightness | default(50) }}'
      default:
      - action: light.turn_off
        target:
          entity_id:
          - light.bedroom_main
          - light.bedroom_bedside
automation:
- id: example_bedroom_motion
  alias: Example - Bedroom motion
  triggers:
  - trigger: state
    entity_id: binary_sensor.bedroom_motion
    from: 'off'
    to: 'on'
    id: detected
  - trigger: state
    entity_id: binary_sensor.bedroom_motion
    to: 'off'
    for: 00:10:00
    id: clear
  - trigger: time_pattern
    minutes: /1
    id: reconcile
  conditions:
  - condition: state
    entity_id: input_boolean.bedroom_motion_enabled
    state: 'on'
  - condition: state
    entity_id: input_boolean.bedroom_manual_block
    state: 'off'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: detected
      - condition: template
        value_template: '{{ is_state(''schedule.evening_mode'',''on'') or is_state(''schedule.night_mode'',''on'')
          }}'
      - condition: state
        entity_id: group.adults
        state: home
      - condition: state
        entity_id: alarm_control_panel.home_alarm
        state: disarmed
      - condition: state
        entity_id: input_boolean.bedroom_manual_off_night
        state: 'off'
      - condition: state
        entity_id: light.bedroom_bedside
        state: 'off'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.bedroom_bedside
        data:
          brightness_pct: 20
          hs_color:
          - 15
          - 89
    - conditions:
      - condition: trigger
        id: detected
      - condition: time
        after: '10:00:00'
      - condition: state
        entity_id: schedule.night_mode
        state: 'off'
      - condition: state
        entity_id: schedule.evening_mode
        state: 'off'
      - condition: state
        entity_id: group.adults
        state: home
      - condition: state
        entity_id: alarm_control_panel.home_alarm
        state: disarmed
      sequence:
      - if: '{{ is_state(''light.bedroom_main'',''off'') }}'
        then:
        - action: light.turn_on
          target:
            entity_id: light.bedroom_main
          data:
            brightness_pct: 50
            color_temp_kelvin: 2202
      - if: '{{ is_state(''light.bedroom_bedside'',''off'') }}'
        then:
        - action: light.turn_on
          target:
            entity_id: light.bedroom_bedside
          data:
            brightness_pct: 50
            hs_color:
            - 15
            - 89
    - conditions:
      - condition: trigger
        id:
        - clear
        - reconcile
      - condition: state
        entity_id: binary_sensor.bedroom_motion
        state: 'off'
        for: 00:10:00
      - condition: template
        value_template: '{{ is_state(''light.bedroom_main'',''on'') or is_state(''light.bedroom_bedside'',''on'')
          }}'
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.bedroom_main
          - light.bedroom_bedside
  mode: restart
  initial_state: false
- id: example_bedroom_manual_reset
  alias: Example - Release bedroom manual control
  triggers:
  - trigger: time_pattern
    minutes: /1
  - trigger: state
    entity_id: schedule.night_mode
    to: 'off'
    id: morning
  conditions:
  - condition: state
    entity_id: input_boolean.bedroom_manual_block
    state: 'on'
  - condition: template
    value_template: '{{ states(''schedule.night_mode'') in [''on'',''off''] }}'
  actions:
  - choose:
    - conditions: '{{ trigger.id == ''morning'' and is_state(''input_boolean.bedroom_manual_off_night'',''on'')
        }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id:
          - input_boolean.bedroom_manual_block
          - input_boolean.bedroom_manual_off_night
    - conditions:
      - condition: state
        entity_id: binary_sensor.bedroom_motion
        state: 'off'
        for: 00:10:00
      - condition: template
        value_template: '{{ as_timestamp(now()) - as_timestamp(states(''input_datetime.bedroom_last_manual''), as_timestamp(now()))
          >= 600 and not (is_state(''input_boolean.bedroom_manual_off_night'',''on'') and is_state(''schedule.night_mode'',''on''))
          }}'
      sequence:
      - if: '{{ is_state(''input_boolean.bedroom_motion_enabled'',''on'') }}'
        then:
        - action: light.turn_off
          target:
            entity_id:
            - light.bedroom_main
            - light.bedroom_bedside
      - action: input_boolean.turn_off
        target:
          entity_id:
          - input_boolean.bedroom_manual_block
          - input_boolean.bedroom_manual_off_night
  mode: single
  initial_state: false
